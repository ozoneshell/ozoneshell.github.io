<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozone Setup</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #111;
            color: #fff;
            padding: 2em;
        }

        .box {
            width: fit-content;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 1em;
            margin-bottom: 1em;
        }

        button {
            padding: 1em 2em;
            border: 0;
            cursor: pointer;
            font-size: 2em;
            border-radius: 1em;

            &:first-child {
                border-radius: 2em 1em 1em 2em;
            }

            &:last-child {
                border-radius: 1em 2em 2em 1em;
            }
        }

        .primary {
            background: #263B9C;
            color: white;
        }

        .danger {
            background: #c42b1c;
            color: white;
        }

        .ghost {
            background: #222;
            color: white;
        }

        #status {
            font-size: 1.5em;
            padding: 2em;
            background-color: #1f1f1f;
            border-radius: 2em;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <!--
    You can customize this page however you wish
    -->
    <div class="box">
        <button class="primary" onclick="install()">Install</button>
        <button class="primary" onclick="update()">Update</button>
        <button class="ghost" onclick="loadInfo()">Info</button>
        <button class="danger" onclick="resetAll()">Reset</button>
        <button class="ghost" onclick="ensureSW()">Reload SW</button>
    </div>
    <div id="status"></div>

    <script type="module">
        import { Ozone } from "/ozone.js"

        const ozone = new Ozone({
            defaultApps: ["files", "settings", "text"],
            sourceURL: "/defaultSource"
        })

        // ozone.install() installs ozone

        const run = (label, fn, done = "Done", fail = "Failed") => async () => {
            setStatus(label)

            try {
                const result = await fn()

                if (result === false) {
                    setStatus(fail)
                    return false
                }

                setStatus(done)
                return true
            } catch (e) {
                setStatus(fail)
                return false
            }
        }
        window.install = run("Starting install...", () => ozone.install())
        window.update = run("Starting update...", () => ozone.update())
        window.resetAll = run("Starting reset...", () => ozone.reset())
        window.ensureSW = run(
            "Checking service worker...",
            () => ozone.ensureServiceWorker(),
            "Service worker updated"
        )
        window.loadInfo = async () => {
            const x = await ozone.info()

            const lines = [
                `Ozone Status`,
                `-------------`,
                `Service Worker: ${x.serviceWorker?.registered ? "<b style='color: lightgreen;'>active</b>" : "<b style='color: red;'>inactive</b>"}`,
                `SW Version: ${x.serviceWorker?.version ?? "unknown"}`,
                `OS Version: ${x.versions?.osware ?? "unknown"}`,
                ``,
                `Instance Config`,
                `-------------`,
                `Source: ${x.config?.sourceURL ?? "unknown"}`,
                `Apps: ${(x.config?.defaultApps ?? []).length}`
            ]

            setStatus(lines.join("<br>"))
        }
        window.loadInfo();
        function setStatus(msg) { document.getElementById("status").innerHTML = msg }
    </script>
</body>

</html>
