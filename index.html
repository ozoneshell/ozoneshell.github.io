<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozone Kernel</title>
    <link rel="stylesheet" href="style.css">
    <link href="assets/logo-tiny.png" rel="icon">
</head>

<body>
    <div class="tui">
        <div class="tuiheader">
            <button onclick="initializeOzone()">Update Everything</button>
            <button id="reset">Reset Everything</button>
            <script>
                document.getElementById("reset").onclick = () => {
                    navigator.serviceWorker.getRegistrations().then(regs => {
                        regs.forEach(reg => reg.unregister());
                    });
                    const req = indexedDB.deleteDatabase("ozoneVFS");
                    req.onsuccess = () => console.log("Database deleted");
                    req.onerror = e => console.error("Delete failed", e.target.error);
                    req.onblocked = () => console.warn("Delete blocked, close other tabs");
                };
            </script>
        </div>
        <div id="logs">
            <div class="log">Welcome to Ozone kernel</div>
        </div>
        <input type="text" id="prompt" placeholder="___">
    </div>
    <script src="script.js"></script>
    <script src="scripts/utility.js"></script>
    <script src="scripts/vfs.js"></script>
</body>

</html>
