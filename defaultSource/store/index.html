<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="/sharedAssets/ozone_gui.css">
    <script src="/sharedAssets/ozone_std_util.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="flex x">
        <div class="flex fit y sidebar">
            <div class="label">Apps</div>
            <div class="button active" onclick="switchSection('front_page')">
                <div class="icon">award_star</div>
                <div class="fill">Featured</div>
            </div>
            <div class="button">
                <div class="icon">cloud_sync</div>
                <div class="fill">My Apps</div>
            </div>
            <div class="label">Settings</div>
            <div class="button">
                <div class="icon">home_storage</div>
                <div class="fill">Edit Providers</div>
            </div>
        </div>
        <div class="flex fill y" style="width: 0;">
            <div class="settings_section fill active" id="front_page">
                <div class="label">Quick Sideload</div>
                <div class="inputs">
                    <input type="text" placeholder="Type or paste a URL...">
                    <input class="button" type="button" data-setting="buttonSetting" value="Install">
                </div>
                <div class="label">Ozone Basics</div>
                <p>Ozone basics store is on development.</p>
                <div class="label">Ozone Defaults</div>
                <div class="app_grid" id="default_apps_grid">
                </div>
            </div>

            <div class="settings_section fill" id="installer_page">
                <img id="app_installer_cover"
                    src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1000&auto=format&fit=crop">
                <div class="installer_header">
                    <div class="data">
                        <div id="app_installer_name">Name</div>
                    </div>
                    <div class="inputs" id="installer_buttons">
                        <input class="button secondary" type="button" data-setting="buttonSetting" value="Open">
                        <input class="button" type="button" data-setting="buttonSetting" value="Update">
                    </div>
                </div>
                <div class="label">Description</div>
                <p id="app_desc">A powerful music player app.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
