<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings App</title>
    <link rel="stylesheet" href="/sharedAssets/ozone_gui.css">
    <script src="/sharedAssets/ozone_std_util.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="flex x">
        <div class="flex fit y sidebar">
            <div class="label">Ozone</div>
            <div class="button active" onclick="switchSection('general', this)">
                <div class="icon">build</div>
                <div class="fill">General</div>
            </div>
            <div class="label">Apps</div>
            <div class="button" onclick="switchSection('apps', this)">
                <div class="icon">apps</div>
                <div class="fill">Installed</div>
            </div>
        </div>
        <div class="flex fill y">
            <div class="settings_section fill active" id="general">
                <div class="label">Basics</div>
                <div class="grouped_settings">
                    <div class="setting_unit">
                        <div class="setting_text">
                            Sorry, this Ozone version does not support customized settings.
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings_section fill" id="apps">
                <div class="label">Installed</div>
                <div id="appList">
                </div>
            </div>
            <div class="settings_section fill" id="appDetail">
                <div class="label">
                    <span class="icon backbtn button">arrow_back</span>
                    <span id="appDetAppName"></span>
                </div>
                <div id="appPermList" class="grouped_settings">

                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
