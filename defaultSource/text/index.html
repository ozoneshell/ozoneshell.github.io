<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="flex y">
    <div class="main_container fill flex y">
        <div class="menu_bar flex x">
            <div class="menu_action" id="openFileBtn">
                <div class="icon">file_open</div>
                <span>Open</span>
            </div>
            <div class="menu_action">
                <div class="icon">add</div>
                <span>New</span>
            </div>
        </div>
        <textarea class="fill" id="main_input" placeholder="Click Open to edit a file."></textarea>
    </div>
    <script src="script.js"></script>
</body>

</html>
