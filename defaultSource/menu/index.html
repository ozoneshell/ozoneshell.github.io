<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozone Menu</title>
    <link rel="stylesheet" href="sharedAssets/ozone_gui.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="editbtns">
        <div class="btn" onclick="toggleSettings()">
            <div class="icon">settings</div>
        </div>
    </div>
    <dialog id="editDialog">
        <div class="header">
            <span>Settings</span>
            <div class="icon" onclick="editDialog.close()">close</div>
        </div>
        <div class="grouped_settings">
            <div class="setting_unit flex y">
                <div class="setting_text">
                    Wallpaper
                </div>
                <div class="inputs">
                    <input class="setting_input" type="text" value="" placeholder="Enter a URL" id="wallp">
                </div>
            </div>
            <div class="setting_unit flex y">
                <div class="setting_text">
                    Greeting text
                </div>
                <div class="inputs">
                    <input class="setting_input" type="text" value="" placeholder="Ozone Shell" id="gree">
                </div>
            </div>
        </div>
    </dialog>
    <img src="https://images.unsplash.com/photo-1511300636408-a63a89df3482?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        class="bgimg" alt="">
    <h1 class="main_logo">Ozone Shell</h1>
    <div class="searchbar">
        <div class="setting_dropdown" id="searchEngineDrpDwn" data-setting="dropdownSetting">
            <div class="current_element">
                <div class="current_element_text">
                    Google
                </div>
                <div class="icon">keyboard_arrow_down</div>
            </div>
            <div class="dropdown_content">
                <div class="item">DuckDuckGo</div>
                <div class="item">Startpage</div>
                <div class="item">Wikipedia</div>
                <div class="item">Ecosia</div>
                <div class="item">Bing</div>
                <div class="item">Google</div>
            </div>
        </div>
        <input type="text" placeholder="Search Internet...">
        <div class="icon" onclick="searchStuff()">search</div>
    </div>
    <div id="menu"></div>
    <script src="script.js"></script>
</body>

</html>
